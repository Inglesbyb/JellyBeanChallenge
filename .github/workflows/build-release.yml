name: Build Signed Android Release (.aab & .apk)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: 📦 Install Node Dependencies
        run: npm ci || npm install

      - name: 🏗️ Build Web Application
        run: npm run build

      - name: 📱 Sync Capacitor Android Project
        run: npx cap sync android

      - name: ☕ Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 🔑 Configure Release Keystore
        working-directory: android
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Decoding release.keystore from GitHub Secrets..."
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.keystore
            echo "storeFile=release.keystore" > keystore.properties
            echo "storePassword=${{ secrets.STORE_PASSWORD || 'JellyBeanRelease2026!' }}" >> keystore.properties
            echo "keyAlias=${{ secrets.KEY_ALIAS || 'jellybean' }}" >> keystore.properties
            echo "keyPassword=${{ secrets.KEY_PASSWORD || 'JellyBeanRelease2026!' }}" >> keystore.properties
          elif [ -f "release.keystore" ] && [ -f "keystore.properties" ]; then
            echo "Using repository configured release.keystore and keystore.properties..."
          else
            echo "Generating automated CI release keystore for signed artifact generation..."
            keytool -genkeypair -v -keystore release.keystore -alias jellybean -keyalg RSA -keysize 2048 -validity 10000 -storetype PKCS12 -storepass JellyBeanRelease2026! -keypass JellyBeanRelease2026! -dname "CN=Jelly Bean 60s Challenge, OU=Arcade, O=JellyBean, C=US"
            echo "storeFile=release.keystore" > keystore.properties
            echo "storePassword=JellyBeanRelease2026!" >> keystore.properties
            echo "keyAlias=jellybean" >> keystore.properties
            echo "keyPassword=JellyBeanRelease2026!" >> keystore.properties
          fi

      - name: ⚙️ Grant Gradlew Execution Permissions
        working-directory: android
        run: chmod +x gradlew

      - name: 🚀 Build Signed Android App Bundle (.aab)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace

      - name: 📱 Build Universal Release APK (.apk)
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: 📤 Upload Google Play App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: JellyBean-PlayStore-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: 📤 Upload Universal Release APK (.apk)
        uses: actions/upload-artifact@v4
        with:
          name: JellyBean-DirectInstall-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30
