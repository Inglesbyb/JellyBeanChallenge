<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140924"/>
      <stop offset="100%" stop-color="#05050c"/>
    </linearGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff70a6"/>
      <stop offset="50%" stop-color="#f72585"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f72585" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background rounded app tile -->
  <rect width="512" height="512" rx="115" fill="url(#bg)"/>
  <rect width="512" height="512" rx="115" fill="none" stroke="#25e6ff" stroke-width="8" opacity="0.6"/>

  <!-- Cartoon Jellybean -->
  <g filter="url(#shadow)" transform="translate(256, 256)">
    <!-- Bean Body -->
    <ellipse cx="0" cy="15" rx="130" ry="175" fill="url(#beanGrad)" stroke="#000000" stroke-width="14"/>
    
    <!-- Face Visor -->
    <ellipse cx="0" cy="-35" rx="72" ry="52" fill="#ffffff" stroke="#000000" stroke-width="10"/>
    
    <!-- Eyes -->
    <ellipse cx="-26" cy="-35" rx="11" ry="17" fill="#000000"/>
    <ellipse cx="26" cy="-35" rx="11" ry="17" fill="#000000"/>
    
    <!-- Eye Highlights -->
    <circle cx="-29" cy="-42" r="4.5" fill="#ffffff"/>
    <circle cx="23" cy="-42" r="4.5" fill="#ffffff"/>

    <!-- Gold Crown for Apex Master -->
    <path d="M -55 -105 L -40 -70 L 0 -95 L 40 -70 L 55 -105 L 45 -55 L -45 -55 Z" fill="#ffd166" stroke="#000000" stroke-width="8"/>
    <circle cx="-55" cy="-105" r="7" fill="#ff4b5c" stroke="#000000" stroke-width="4"/>
    <circle cx="0" cy="-95" r="8" fill="#4cc9f0" stroke="#000000" stroke-width="4"/>
    <circle cx="55" cy="-105" r="7" fill="#3dffa2" stroke="#000000" stroke-width="4"/>
  </g>
</svg>
